<!DOCTYPE html>
<html>
<head>
    <title>Interaction 3D avec Three.js et Leaflet.js</title>
    <style>
        body { margin: 0; display: flex; }
        #map { height: 100vh; width: 50vw; }
        #globe { height: 100vh; width: 50vw; }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
</head>
<body>

<div id="map"></div>
<div id="globe"></div>

<script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.148.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.148.0/examples/jsm/"
    }
}
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // ------------------- Initialisation de la carte Leaflet -------------------

    const map = L.map('map').setView([51.505, -0.09], 2);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China (Hong Kong), Esri (Thailand), TomTom, 2012'
}).addTo(map);

    // ------------------- Initialisation de la scène Three.js -------------------

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, (window.innerWidth / 2) / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth / 2, window.innerHeight);
    document.getElementById('globe').appendChild(renderer.domElement);

    window.addEventListener('resize', () => {
        const aspect = (window.innerWidth / 2) / window.innerHeight;
        camera.aspect = aspect;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth / 2, window.innerHeight);
    });

    const controls = new OrbitControls(camera, renderer.domElement);

    const geometry = new THREE.SphereGeometry(1, 32, 32);
    const texture = new THREE.TextureLoader().load('./earth.jpg');  
    const material = new THREE.MeshPhongMaterial({ map: texture });
    const earth = new THREE.Mesh(geometry, material);
    scene.add(earth);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
    directionalLight.position.set(5, 3, 5);
    scene.add(directionalLight);

    camera.position.z = 3;

    function latLongToVector3(lat, lon, radius) {
        const phi = (90 - lat) * (Math.PI / 180);
        const theta = (lon + 180) * (Math.PI / 180);
        const x = -Math.sin(phi) * Math.cos(theta);
        const z = Math.sin(phi) * Math.sin(theta);
        const y = Math.cos(phi);
        return new THREE.Vector3(x, y, z).multiplyScalar(radius);
    }

    function addCountryMarker(lat, lon, flagUrl) {
        L.marker([lat, lon]).addTo(map).on('click', () => {
            focusOnCountry(lat, lon);
        });

        const loader = new THREE.TextureLoader();
        loader.load(flagUrl,
            function(texture) {
                const geometry = new THREE.SphereGeometry(0.02, 32, 32);
                const material = new THREE.MeshBasicMaterial({ map: texture });
                const marker = new THREE.Mesh(geometry, material);
                const position = latLongToVector3(lat, lon, 1.01);
                marker.position.copy(position);
                earth.add(marker); 
            },
            undefined,
            function(err) {
                console.error('Erreur lors du chargement du drapeau:', err);
            }
        );
    }

    function focusOnCountry(lat, lon) {
        const targetPosition = latLongToVector3(lat, lon, 2); 
        gsap.to(camera.position, {
            x: targetPosition.x,
            y: targetPosition.y,
            z: targetPosition.z,
            duration: 1,
            onUpdate: () => controls.update()
        });
        controls.target.copy(latLongToVector3(lat, lon, 1));
        controls.update();
    }

    navigator.geolocation.getCurrentPosition((position) => {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        const userPosition = latLongToVector3(lat, lon, 1.01);

        const loader = new GLTFLoader();
        loader.load('./hand_pointer.glb', (gltf) => {
            const model = gltf.scene;
            model.scale.set(0.05, 0.05, 0.05); 
            model.position.copy(userPosition);
            scene.add(model);  
        });
    });

    fetch('https://restcountries.com/v3.1/all')
        .then(response => response.json())
        .then(data => {
            data.forEach(country => {
                if (country.latlng && country.flags) {
                    addCountryMarker(country.latlng[0], country.latlng[1], country.flags.png);
                }
            });
        });

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }

    animate();

</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
</body>
</html>
